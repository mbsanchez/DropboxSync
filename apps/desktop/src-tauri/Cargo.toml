[package]
name = "dropbox_sync_desktop"
version = "0.1.0"
description = "Dropbox Sync Desktop"
authors = ["dropbox-sync-team"]
edition = "2021"

[lib]
name = "dropbox_sync_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = ["config-json5"] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
notify-debouncer-mini = "0.7.0"
arboard = { version = "3", default-features = false }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
rfd = "0.14"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon", "image-png", "config-json5"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
thiserror = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
urlencoding = "2"
walkdir = "2"
zeroize = "1.9.0"

[dev-dependencies]
tempfile = "3"

# DBSYNC-114: mock IPC (`tauri::test`) for the command-argument tests. Dev only, and not on
# Windows: tauri-build embeds the Common Controls v6 manifest in the app binaries only, so a
# lib test binary linking this feature fails to start there (STATUS_ENTRYPOINT_NOT_FOUND).
[target.'cfg(not(windows))'.dev-dependencies]
tauri = { version = "2", features = ["test"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Already in Cargo.lock transitively via Tauri, but a transitive crate cannot be imported —
# it has to be declared. Used by `finder_extension.rs` (DBSYNC-86), `app_group.rs` (DBSYNC-97) and `logging.rs`.
objc2 = "0.6"
# Completion-handler blocks for `NSFileProviderManager` in `file_provider.rs` (DBSYNC-95). 0.6.2 is already in
# Cargo.lock via Tauri.
block2 = "0.6"
# NFC/NFD index-key identity (DBSYNC-103). APFS is form-insensitive, the index is not.
unicode-normalization = "0.1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
] }
windows = { version = "0.61", features = [
    "ApplicationModel",
    "Foundation",
    "Security_Cryptography",
    "Storage",
    "Storage_Provider",
    "Storage_Search",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_CloudFilters",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_CorrelationVector",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }
