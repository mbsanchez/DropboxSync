name: ci

on:
  push:
    branches: [main, master]
  pull_request:

# Read-only by default: nothing in this workflow writes to the repo, and a token that
# cannot write is one that cannot be abused by a compromised action.
permissions:
  contents: read

# One run per ref, but cancellation ONLY on pull requests. Pushing twice to a PR should
# not leave the first run burning a Windows runner nobody will read.
#
# On a push to main, cancelling would discard the only automated verification a merged
# commit ever gets: two merges inside six minutes and the first commit is never tested on
# any platform, silently. With a manual QA strategy this pipeline is the sole automated
# gate, so a merged commit must always finish its run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Literals, not secrets. The app reads these through `option_env!` with fallbacks
# (auth/oauth.rs), so CI only needs them to be present, never to be real. Hoisted to the
# workflow level in DBSYNC-38 so every job inherits them and none can be forgotten.
env:
  DROPBOX_APP_KEY: dummy
  DROPBOX_REDIRECT_URI: http://localhost:53682/callback

# Split into one job per kind of check (DBSYNC-38, GitHub #120). It was a single
# `desktop-build` job until 2026-08-25.
#
# The split is not cosmetic: it is what makes a Windows leg possible at all. Three of the
# old job's steps cannot run on Windows — the Finder Sync checks shell out to `xcrun
# swiftc`, and `bundle:dev` produces a macOS `.app`. Adding `strategy.matrix.os` to the
# monolith would have broken all three. Slices #121 and #122 add Windows on top of this
# shape. Splitting first is what made a later red build on Windows attributable to
# Windows rather than to the restructuring.
#
# `rust` now runs on both platforms (#121). `macos-app` and `frontend` stay on macOS:
# the first is macOS-only by construction, the second is platform-independent and would
# be cheaper on `ubuntu-latest` — an optimisation with its own risk (npm's
# platform-specific optional packages), worth doing on its own and not here.
jobs:
  # Portable Rust, on every platform that ships.
  rust:
    # THE POINT OF DBSYNC-38 (GitHub #121). Until this leg existed, everything behind
    # `#[cfg(windows)]` — five modules, ~4000 lines, `cloud_filter.rs` alone at 2024 —
    # had never been compiled by any pipeline, and the ~22 unit tests inside them had
    # only ever run on the maintainer's own machine. A PR could delete a function
    # `cloud_filter.rs` calls and CI would report green.
    strategy:
      # NOT the default. With fail-fast on, a macOS failure cancels the Windows job —
      # cancelling precisely the signal this leg exists to buy. Load-bearing, not taste.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A hang, not an assertion, is the characteristic failure of Win32 I/O-callback code
    # under test — and the default here is 360 minutes on a runner billed at 2x. Twenty is
    # generous against a 6m25s cold Windows run.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Distinct per job, or `rust` and `macos-app` evict each other and the cache
          # buys nothing. rust-cache appends the runner OS and arch to the key, so the
          # two matrix legs get separate caches without any help from us.
          prefix-key: rust-checks
          workspaces: apps/desktop/src-tauri
          # Only the default branch writes. A 10 GB budget shared by every open PR would
          # evict main's cache — the one every new PR starts from — to store caches that
          # no other branch can even read.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Two things, and NOT the one the first draft of this comment claimed. It does
          # not rescue red PR runs: `save-if` gates the save body outright, so on a PR
          # branch nothing is written whatever this says. What it does do is let main keep
          # a cache from a failed run, and — because it drives the action's `post-if` — let
          # the save step run at all when a job is cancelled.
          cache-on-failure: true
          # Both values `auth/oauth.rs` reads through `option_env!` — DROPBOX_APP_KEY and
          # DROPBOX_REDIRECT_URI. `option_env!` does not force a rebuild when they change,
          # so without them in the key a cached artifact can embed a stale value and
          # nothing reports it. Harmless at `dummy`; a green-but-wrong binary the day the
          # release workflow wires a real key.
          #
          # The prefix is enough: rust-cache matches with `startsWith`, and this list is
          # ADDED to its built-ins (CARGO CC CFLAGS CXX CMAKE RUST) rather than replacing
          # them.
          env-vars: DROPBOX

      # No `npm install` here, and the reason is narrower than "the Rust tests don't need
      # the frontend" — it is conditional, so read this before changing the command.
      #
      # `generate_context!` DOES embed `frontendDist`, but only outside dev mode:
      # `tauri-build` sets `dev = !has_feature("custom-protocol")` (build.rs), and
      # `tauri-codegen`'s `else if dev && config.build.dev_url.is_some()` branch then skips
      # the embed entirely. So this job compiles without `dist/` because two config facts
      # happen to hold: `custom-protocol` is off, and `devUrl` is set in tauri.conf.json.
      #
      # Change either — add `--all-features`, or drop `devUrl` — and this step fails with an
      # error about a missing frontend directory that never mentions npm. Restore
      # `npm install` and the frontend build here if that day comes.
      - name: Rust tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Rust lints
        # Not `-D warnings`: main currently carries pre-existing warnings, and failing the
        # build on them would put this workflow straight back to permanently red — which is
        # how it got switched off in the first place. Clearing them is its own change;
        # making them visible is this one. The same reasoning will apply, harder, to the
        # Windows leg: those modules have never been linted by anything.
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets

  # macOS-only artefacts: the Swift appex and the `.app` bundle.
  macos-app:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: macos-app
          workspaces: apps/desktop/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
          env-vars: DROPBOX

      - name: Install dependencies
        # `ci`, not `install`: it fails when package-lock.json disagrees with package.json
        # instead of quietly resolving something new. A check that cannot fail is not a
        # check, and on a runner the lockfile is the whole point.
        run: npm ci

      - name: Finder Sync extension checks
        # Compiles the real BadgeDiff.swift with `swiftc` and runs its checks. macOS-only
        # by construction, and the only automated coverage the extension has.
        run: apps/desktop/native/macos/FinderSyncExtension/Tests/run-badge-diff-tests.sh

      - name: Build macOS app bundle
        # `bundle:dev` (--bundles app), not `tauri build`. The full build also produces a
        # DMG, a stage that has never executed in CI even once because every run died
        # earlier. Producing an installer belongs to the release workflow (GitHub #85);
        # a PR check only needs to prove the app links.
        #
        # This step also builds the Swift appex: `beforeBuildCommand` runs
        # `scripts/tauri-before-build.mjs`, which calls `build:finder-sync` on darwin.
        # That is why it must never be matrixed onto another OS.
        run: npm --workspace apps/desktop run bundle:dev

  # TypeScript typecheck + production bundle. Portable, so it runs exactly once.
  frontend:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # `ci`, not `install`: it fails when package-lock.json disagrees with package.json
        # instead of quietly resolving something new. A check that cannot fail is not a
        # check, and on a runner the lockfile is the whole point.
        run: npm ci

      - name: Frontend build and typecheck
        # `npm run build` is `tsc && vite build`, so this is the typecheck too.
        #
        # It is knowingly duplicated three times: `tauri-before-build.mjs` runs the same
        # build unconditionally, so `bundle:dev` and `bundle:win` each repeat it. At
        # roughly half a second it is not worth engineering away — recorded here so it is
        # not later mistaken for a defect.
        run: npm --workspace apps/desktop run build

  # Windows artefacts: the app links, and the Explorer shell extension type-checks
  # (DBSYNC-38, GitHub #122).
  windows-app:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Distinct from the `rust` job's Windows leg: that one builds the debug profile
          # for tests, this one builds release through `tauri build`. They share almost no
          # artefacts, so a shared key would mean two jobs overwriting each other's cache
          # for no benefit.
          prefix-key: windows-app
          # Two workspaces. `shell-menu` is a SEPARATE cargo project — its own Cargo.toml
          # and Cargo.lock, referenced by no workspace — so rust-cache has to be told about
          # it explicitly or its target dir is never cached.
          workspaces: |
            apps/desktop/src-tauri
            apps/desktop/native/windows/shell-menu
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
          env-vars: DROPBOX

      - name: Install dependencies
        # First time npm runs on a Windows runner in this pipeline. The risk worth naming
        # is pruned platform-specific optional dependencies — `npm ci` installs strictly
        # from the lockfile, and package-lock.json does carry the full matrix, including
        # @rollup/rollup-win32-x64-msvc and @tauri-apps/cli-win32-x64-msvc.
        run: npm ci

      - name: Build Windows app
        # `bundle:win` is `tauri build --no-bundle`: it proves the app links, and
        # deliberately produces no installer. Mirrors the macOS choice — packaging belongs
        # to the release workflow (DBSYNC-72 Slice 5), never to a PR check.
        run: npm --workspace apps/desktop run bundle:win

      - name: Check the Explorer shell-menu crate
        # An independent cargo project that NO CI step has ever built, while
        # `windows_shell_menu.rs` registers its output at runtime. One `check` covers both
        # of its targets: the cdylib/rlib and the `dropbox_sync_cloudmenu` COM ExeServer
        # binary (DBSYNC-62).
        #
        # `check`, not `build`: nothing here consumes the DLL, so type-checking is the
        # signal and linking would be pure cost.
        run: cargo check --manifest-path apps/desktop/native/windows/shell-menu/Cargo.toml
